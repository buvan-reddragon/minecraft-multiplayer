<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>3D City Sandbox Multiplayer</title>
  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden;
      font-family: Arial, sans-serif; user-select: none; -webkit-user-select: none;
      background: #000;
    }

    /* Force Landscape Warning for Mobile Portrait */
    @media screen and (orientation: portrait) {
      #landscape-notice {
        display: flex !important;
      }
    }
    #landscape-notice {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.9); color: #fff; z-index: 100;
      display: none; flex-direction: column; justify-content: center; align-items: center;
      text-align: center; font-size: 20px; font-weight: bold;
    }

    #canvas-container { width: 100vw; height: 100vh; }

    /* Crosshair */
    #crosshair {
      position: absolute; top: 50%; left: 50%; width: 12px; height: 12px;
      margin-top: -6px; margin-left: -6px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.8); border: 2px solid black;
      pointer-events: none; z-index: 10;
    }

    /* Room Select Overlay */
    #room-overlay {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.85); z-index: 50; display: flex;
      flex-direction: column; justify-content: center; align-items: center; color: white;
    }
    .room-btn {
      padding: 12px 24px; margin: 8px; font-size: 18px; font-weight: bold;
      background: #28a745; color: white; border: none; border-radius: 6px; cursor: pointer;
    }

    /* Top Left UI */
    #ui-container {
      position: absolute; top: 10px; left: 10px; z-index: 10;
      color: white; text-shadow: 2px 2px 4px black; font-size: 14px;
    }
    #health-bar-container {
      width: 180px; height: 16px; background: rgba(0,0,0,0.6);
      border: 2px solid white; border-radius: 4px; margin-top: 4px; overflow: hidden;
    }
    #health-bar { width: 100%; height: 100%; background: #28a745; }

    /* Chat System */
    #chat-container {
      position: absolute; bottom: 20px; left: 20px; z-index: 20;
      width: 280px; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 8px;
    }
    #chat-messages {
      height: 100px; overflow-y: auto; color: white; font-size: 12px;
      margin-bottom: 5px; display: flex; flex-direction: column; gap: 4px;
    }
    #chat-input-container { display: flex; gap: 5px; }
    #chat-input { flex: 1; padding: 5px; border-radius: 4px; border: none; outline: none; }
    #chat-send { padding: 5px 10px; background: #007bff; color: white; border: none; border-radius: 4px; }

    /* Mobile Virtual Joystick & Buttons */
    #joystick-zone {
      position: absolute; bottom: 20px; left: 20px; width: 120px; height: 120px;
      background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.4);
      border-radius: 50%; z-index: 30; display: none; touch-action: none;
    }
    #joystick-knob {
      position: absolute; top: 35px; left: 35px; width: 50px; height: 50px;
      background: rgba(255,255,255,0.7); border-radius: 50%; pointer-events: none;
    }
    .mobile-btn {
      position: absolute; background: rgba(255,255,255,0.35); border: 2px solid white;
      border-radius: 50%; color: white; display: none; justify-content: center;
      align-items: center; font-weight: bold; z-index: 30; touch-action: none;
    }
    #btn-shoot { bottom: 20px; right: 20px; width: 70px; height: 70px; background: rgba(220,53,69,0.7); }
    #btn-jump { bottom: 100px; right: 20px; width: 60px; height: 60px; }
    #btn-action { bottom: 20px; right: 100px; width: 60px; height: 60px; background: rgba(255,193,7,0.7); }

    /* Respawn Screen */
    #respawn-screen {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(180, 0, 0, 0.75); display: none; flex-direction: column;
      justify-content: center; align-items: center; color: white; z-index: 40;
    }
    #respawn-btn {
      padding: 12px 28px; font-size: 18px; background: white; color: black;
      border: none; border-radius: 6px; font-weight: bold; cursor: pointer;
    }
  </style>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <!-- Landscape Notice -->
  <div id="landscape-notice">🔄 Please rotate your device into Landscape mode!</div>

  <!-- Room Selection Modal -->
  <div id="room-overlay">
    <h2>Choose a Server Room</h2>
    <div>
      <button class="room-btn" onclick="joinRoom('Room 1')">Room 1</button>
      <button class="room-btn" onclick="joinRoom('Room 2')">Room 2</button>
      <button class="room-btn" onclick="joinRoom('Room 3')">Room 3</button>
      <button class="room-btn" onclick="joinRoom('Room 4')">Room 4</button>
    </div>
  </div>

  <div id="canvas-container"></div>
  <div id="crosshair"></div>

  <!-- UI & Health -->
  <div id="ui-container">
    <div><strong>Room:</strong> <span id="current-room">None</span></div>
    <div><strong>HP:</strong> <span id="hp-text">100</span></div>
    <div id="health-bar-container"><div id="health-bar"></div></div>
  </div>

  <!-- Chat Box -->
  <div id="chat-container">
    <div id="chat-messages"></div>
    <div id="chat-input-container">
      <input type="text" id="chat-input" placeholder="Type chat message..." />
      <button id="chat-send">Send</button>
    </div>
  </div>

  <!-- Respawn Screen -->
  <div id="respawn-screen">
    <h1>YOU DIED</h1>
    <button id="respawn-btn">RESPAWN</button>
  </div>

  <!-- Mobile Touch Controls -->
  <div id="joystick-zone"><div id="joystick-knob"></div></div>
  <div id="btn-shoot" class="mobile-btn">FIRE</div>
  <div id="btn-jump" class="mobile-btn">JUMP</div>
  <div id="btn-action" class="mobile-btn">CAR</div>

  <script src="client.js"></script>
</body>
</html>
