<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>City Sandbox Multiplayer</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
    }
    #ui-container {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      color: white;
      text-shadow: 1px 1px 2px black;
    }
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 10px;
      height: 10px;
      margin-top: -5px;
      margin-left: -5px;
      border-radius: 50%;
      background-color: white;
      border: 1px solid black;
      pointer-events: none;
      z-index: 10;
    }
    #health-bar-container {
      width: 200px;
      height: 20px;
      background: rgba(0,0,0,0.6);
      border: 2px solid #fff;
      margin-top: 5px;
    }
    #health-bar {
      width: 100%;
      height: 100%;
      background: #00ff00;
    }
    #vehicle-prompt {
      position: absolute;
      bottom: 20%;
      width: 100%;
      text-align: center;
      color: yellow;
      font-size: 20px;
      font-weight: bold;
      text-shadow: 2px 2px 4px black;
      display: none;
      z-index: 10;
    }
    #respawn-screen {
      position: absolute;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(255, 0, 0, 0.7);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      z-index: 20;
    }
    #respawn-btn {
      padding: 15px 30px;
      font-size: 20px;
      background: #fff;
      color: #000;
      border: none;
      cursor: pointer;
      font-weight: bold;
      margin-top: 15px;
    }
    /* Mobile Controls */
    .mobile-btn {
      position: absolute;
      background: rgba(255,255,255,0.3);
      border: 2px solid white;
      border-radius: 50%;
      color: white;
      display: none;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      z-index: 15;
    }
    #btn-shoot { bottom: 30px; right: 30px; width: 70px; height: 70px; background: rgba(255,0,0,0.4); }
    #btn-jump { bottom: 110px; right: 30px; width: 60px; height: 60px; }
    #btn-action { bottom: 30px; right: 120px; width: 60px; height: 60px; background: rgba(255,255,0,0.4); }
  </style>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="crosshair"></div>
  
  <div id="ui-container">
    <div><strong>HP:</strong> <span id="hp-text">100</span></div>
    <div id="health-bar-container"><div id="health-bar"></div></div>
    <div>Press <strong>E</strong> or Touch <strong>ACTION</strong> to Enter/Exit Car</div>
    <div>Click to Shoot | Space to Jump</div>
  </div>

  <div id="vehicle-prompt">Press 'E' to Drive</div>

  <div id="respawn-screen">
    <h1>YOU DIED</h1>
    <button id="respawn-btn">RESPAWN</button>
  </div>

  <!-- Mobile Touch Controls -->
  <div id="btn-shoot" class="mobile-btn">FIRE</div>
  <div id="btn-jump" class="mobile-btn">JUMP</div>
  <div id="btn-action" class="mobile-btn">CAR</div>

  <script src="client.js"></script>
</body>
</html>
