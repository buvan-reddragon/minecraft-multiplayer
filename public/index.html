<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcadia of knight</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1a0f2e;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #chat-container {
      position: absolute;
      bottom: 20px;
      left: 20px;
      width: 320px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(245, 158, 11, 0.6);
      border-radius: 8px;
      padding: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      z-index: 100;
      backdrop-filter: blur(4px);
    }
    #chat-messages {
      height: 140px;
      overflow-y: auto;
      color: #e2e8f0;
      font-size: 14px;
      margin-bottom: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    #chat-messages::-webkit-scrollbar {
      width: 4px;
    }
    #chat-messages::-webkit-scrollbar-thumb {
      background: rgba(245, 158, 11, 0.4);
      border-radius: 2px;
    }
    #chat-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid #7c3aed;
      color: #fff;
      padding: 8px 12px;
      border-radius: 4px;
      outline: none;
      font-size: 14px;
    }
    #chat-input:focus {
      border-color: #f59e0b;
    }
    #instructions {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #f59e0b;
      font-size: 14px;
      background: rgba(0, 0, 0, 0.5);
      padding: 8px 14px;
      border-radius: 6px;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="instructions">
    ⚔️ <b>Arcadia of knight</b> | Use <b>W A S D</b> or <b>Arrow Keys</b> to Move | Press <b>Enter</b> to Chat / Play Music
  </div>

  <div id="chat-container">
    <div id="chat-messages">
      <div style="color: #94a3b8; font-style: italic;">Welcome to Arcadia of knight! Press Enter to type a message.</div>
    </div>
    <input type="text" id="chat-input" placeholder="Press Enter to chat..." autocomplete="off" />
  </div>

  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- Socket.IO Client Library -->
  <script src="/socket.io/socket.io.js"></script>
  <!-- Client Logic -->
  <script src="client.js"></script>
</body>
</html>
