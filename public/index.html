<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcadia Maze - 2D Top-Down Multiplayer GTA Style</title>
  <style>
    * { box-sizing: border-box; user-select: none; }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background-color: #0f172a;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #game-canvas {
      display: block; width: 100vw; height: 100vh; background: #020617;
    }

    #name-portal {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(15, 23, 42, 0.95); z-index: 200; display: flex;
      flex-direction: column; justify-content: center; align-items: center; color: white;
    }
    #name-portal h1 { color: #f59e0b; margin-bottom: 8px; text-shadow: 0 0 10px rgba(245, 158, 11, 0.5); }
    #name-portal input {
      padding: 12px 16px; font-size: 18px; border-radius: 6px; border: 2px solid #7c3aed;
      margin-bottom: 16px; width: 260px; text-align: center; outline: none; background: #0f172a; color: white;
    }
    #name-portal button {
      padding: 12px 32px; font-size: 18px; background: #f59e0b; color: #0f172a;
      border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s;
    }
    #name-portal button:hover { background: #d97706; }

    /* HUD Elements */
    #hud {
      position: absolute; top: 20px; left: 20px; z-index: 100;
      display: flex; flex-direction: column; gap: 8px;
    }
    #health-bar-container {
      width: 240px; height: 24px; background: rgba(15, 23, 42, 0.85);
      border: 2px solid #f59e0b; border-radius: 6px; overflow: hidden; position: relative;
    }
    #health-bar-fill {
      width: 100%; height: 100%; background: #22c55e; transition: width 0.2s;
    }
    #health-text {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 13px; font-weight: bold; text-shadow: 1px 1px 2px black;
    }
    #kill-counter {
      color: #38bdf8; font-size: 14px; font-weight: bold;
      background: rgba(0, 0, 0, 0.75); padding: 6px 12px; border-radius: 6px;
      border: 1px solid rgba(56, 189, 248, 0.4); width: max-content;
    }

    /* Controls Instructions Overlay */
    #instructions {
      position: absolute; bottom: 20px; right: 20px; color: #f59e0b;
      font-size: 12px; background: rgba(0, 0, 0, 0.75); padding: 10px 14px;
      border-radius: 6px; pointer-events: none; border: 1px solid rgba(245, 158, 11, 0.3);
      line-height: 1.6; z-index: 100;
    }

    /* Chat UI */
    #chat-container {
      position: absolute; bottom: 20px; left: 20px; width: 300px;
      background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(245, 158, 11, 0.6);
      border-radius: 8px; padding: 10px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      z-index: 100; backdrop-filter: blur(4px);
    }
    #chat-header {
      color: #f59e0b; font-size: 13px; font-weight: bold; margin-bottom: 6px;
    }
    #chat-messages {
      height: 110px; overflow-y: auto; color: #e2e8f0; font-size: 12px;
      margin-bottom: 8px; display: flex; flex-direction: column; gap: 4px;
    }
    #chat-input {
      width: 100%; background: rgba(0, 0, 0, 0.6); border: 1px solid #7c3aed;
      color: #fff; padding: 6px 10px; border-radius: 4px; outline: none; font-size: 12px;
    }
  </style>
</head>
<body>

  <div id="name-portal">
    <h1>Arcadia Maze Conquest</h1>
    <p style="color: #94a3b8; margin-bottom: 20px;">GTA 1 Style Top-Down 2D Multiplayer</p>
    <input type="text" id="username-input" placeholder="Knight Name" maxlength="14" />
    <button id="join-btn">ENTER MAZE</button>
  </div>

  <div id="hud">
    <div id="health-bar-container">
      <div id="health-bar-fill"></div>
      <div id="health-text">HP: 100 / 100</div>
    </div>
    <div id="kill-counter">Opponents Defeated: 0</div>
  </div>

  <div id="instructions">
    🎯 <b>Top-Down Controls:</b><br>
    • Move Player: <b>W A S D</b><br>
    • Aim Direction: <b>Mouse Cursor</b><br>
    • Shoot Bullet: <b>Left Mouse Click</b><br>
    • Open/Send Chat: <b>Enter Key</b>
  </div>

  <div id="chat-container">
    <div id="chat-header">MAZE CHAT</div>
    <div id="chat-messages">
      <div style="color: #94a3b8; font-style: italic;">Press Enter to chat with opponents!</div>
    </div>
    <input type="text" id="chat-input" placeholder="Press Enter to type..." autocomplete="off" />
  </div>

  <canvas id="game-canvas"></canvas>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
