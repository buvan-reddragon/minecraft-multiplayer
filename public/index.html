<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Global Sandbox Multiplayer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      font-family: Arial, sans-serif; user-select: none; -webkit-user-select: none;
      background: #000; position: fixed;
    }
    #canvas-container {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1;
    }
    #crosshair {
      position: absolute; top: 50%; left: 50%; width: 10px; height: 10px;
      margin-top: -5px; margin-left: -5px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.9); border: 2px solid black;
      pointer-events: none; z-index: 10;
    }

    /* Name Portal Overlay */
    #name-portal {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.85); z-index: 60; display: flex;
      flex-direction: column; justify-content: center; align-items: center; color: white;
    }
    #name-portal input {
      padding: 12px; font-size: 18px; border-radius: 6px; border: none;
      margin-bottom: 12px; width: 220px; text-align: center; outline: none;
    }
    #name-portal button {
      padding: 12px 28px; font-size: 18px; background: #28a745; color: white;
      border: none; border-radius: 6px; font-weight: bold; cursor: pointer;
    }

    /* HUD */
    #ui-container {
      position: absolute; top: 12px; left: 12px; z-index: 10;
      color: white; text-shadow: 2px 2px 4px black; font-size: 14px; pointer-events: none;
    }
    #health-bar-container {
      width: 160px; height: 14px; background: rgba(0,0,0,0.6);
      border: 2px solid white; border-radius: 4px; margin-top: 4px; overflow: hidden;
    }
    #health-bar { width: 100%; height: 100%; background: #28a745; }

    /* Chat UI */
    #chat-container {
      position: absolute; bottom: 20px; left: 20px; z-index: 40;
      width: 260px; background: rgba(0,0,0,0.65); padding: 10px; border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.2); pointer-events: auto;
    }
    #chat-messages {
      height: 100px; overflow-y: auto; color: white; font-size: 12px;
      margin-bottom: 6px; display: flex; flex-direction: column; gap: 4px;
      word-break: break-word;
    }
    .chat-msg { background: rgba(255,255,255,0.15); padding: 4px 6px; border-radius: 4px; }
    #chat-input-container { display: flex; gap: 4px; }
    #chat-input { flex: 1; padding: 6px; border-radius: 4px; border: none; outline: none; font-size: 12px; }
    #chat-send { padding: 6px 10px; background: #007bff; color: white; border: none; border-radius: 4px; font-size: 12px; cursor: pointer; }

    /* Mobile Controls */
    #joystick-zone {
      position: absolute; bottom: 20px; left: 20px; width: 110px; height: 110px;
      background: rgba(255,255,255,0.25); border: 2px solid rgba(255,255,255,0.5);
      border-radius: 50%; z-index: 30; display: none; touch-action: none;
    }
    #joystick-knob {
      position: absolute; top: 30px; left: 30px; width: 50px; height: 50px;
      background: rgba(255,255,255,0.8); border-radius: 50%; pointer-events: none;
    }
    .mobile-btn {
      position: absolute; background: rgba(255,255,255,0.35); border: 2px solid white;
      border-radius: 50%; color: white; display: none; justify-content: center;
      align-items: center; font-weight: bold; z-index: 30; touch-action: none;
    }
    #btn-shoot { bottom: 20px; right: 20px; width: 65px; height: 65px; background: rgba(220,53,69,0.7); }
    #btn-jump { bottom: 95px; right: 20px; width: 55px; height: 55px; }
    #btn-action { bottom: 20px; right: 95px; width: 55px; height: 55px; background: rgba(255,193,7,0.7); }

    /* Respawn Modal */
    #respawn-screen {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(180, 0, 0, 0.8); display: none; flex-direction: column;
      justify-content: center; align-items: center; color: white; z-index: 50;
    }
    #respawn-btn {
      padding: 12px 28px; font-size: 18px; background: white; color: black;
      border: none; border-radius: 6px; font-weight: bold; cursor: pointer;
    }
  </style>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <!-- User Name Entry Screen -->
  <div id="name-portal">
    <h2>Enter Your Name</h2>
    <br>
    <input type="text" id="username-input" placeholder="Player Name" maxlength="12" />
    <button id="join-btn">JOIN GAME</button>
  </div>

  <div id="canvas-container"></div>
  <div id="crosshair"></div>

  <!-- HUD -->
  <div id="ui-container">
    <div><strong>Player:</strong> <span id="player-display-name" style="color:#28a745;">...</span></div>
    <div><strong>HP:</strong> <span id="hp-text">100</span></div>
    <div id="health-bar-container"><div id="health-bar"></div></div>
  </div>

  <!-- Chat Box -->
  <div id="chat-container">
    <div id="chat-messages"></div>
    <div id="chat-input-container">
      <input type="text" id="chat-input" placeholder="Type message..." />
      <button id="chat-send">Send</button>
    </div>
  </div>

  <!-- Respawn Modal -->
  <div id="respawn-screen">
    <h1>YOU DIED</h1>
    <button id="respawn-btn">RESPAWN</button>
  </div>

  <!-- Touch Controls -->
  <div id="joystick-zone"><div id="joystick-knob"></div></div>
  <div id="btn-shoot" class="mobile-btn">FIRE</div>
  <div id="btn-jump" class="mobile-btn">JUMP</div>
  <div id="btn-action" class="mobile-btn">CAR</div>

  <script src="client.js"></script>
</body>
</html>
