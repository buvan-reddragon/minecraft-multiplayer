<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcadia of knight</title>
  <style>
    * { box-sizing: border-box; user-select: none; }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background-color: #130a24;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    /* Username Entry Portal */
    #name-portal {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(10, 5, 20, 0.92); z-index: 200; display: flex;
      flex-direction: column; justify-content: center; align-items: center; color: white;
    }
    #name-portal h1 { color: #f59e0b; margin-bottom: 8px; text-shadow: 0 0 10px rgba(245, 158, 11, 0.5); }
    #name-portal input {
      padding: 12px 16px; font-size: 18px; border-radius: 6px; border: 2px solid #7c3aed;
      margin-bottom: 16px; width: 260px; text-align: center; outline: none; background: #0f172a; color: white;
    }
    #name-portal button {
      padding: 12px 32px; font-size: 18px; background: #f59e0b; color: #0f172a;
      border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s;
    }
    #name-portal button:hover { background: #d97706; }

    /* In-Game Chat UI */
    #chat-container {
      position: absolute; bottom: 20px; left: 20px; width: 320px;
      background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(245, 158, 11, 0.6);
      border-radius: 8px; padding: 12px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      z-index: 100; backdrop-filter: blur(4px);
    }
    #chat-messages {
      height: 140px; overflow-y: auto; color: #e2e8f0; font-size: 14px;
      margin-bottom: 8px; display: flex; flex-direction: column; gap: 6px;
    }
    #chat-input {
      width: 100%; background: rgba(0, 0, 0, 0.6); border: 1px solid #7c3aed;
      color: #fff; padding: 8px 12px; border-radius: 4px; outline: none; font-size: 14px;
    }

    #instructions {
      position: absolute; top: 20px; left: 20px; color: #f59e0b;
      font-size: 14px; background: rgba(0, 0, 0, 0.6); padding: 8px 14px;
      border-radius: 6px; pointer-events: none; border: 1px solid rgba(245, 158, 11, 0.3);
    }
  </style>
</head>
<body>

  <div id="name-portal">
    <h1>Arcadia of knight</h1>
    <p style="color: #94a3b8; margin-bottom: 20px;">Enter your character name to enter the realm</p>
    <input type="text" id="username-input" placeholder="Knight Name" maxlength="14" />
    <button id="join-btn">ENTER REALM</button>
  </div>

  <div id="instructions">
    ⚔️ <b>Arcadia of knight</b> | Move: <b>W A S D</b> / Arrows | Chat/Music: <b>Enter</b>
  </div>

  <div id="chat-container">
    <div id="chat-messages">
      <div style="color: #94a3b8; font-style: italic;">Welcome to Arcadia of knight!</div>
    </div>
    <input type="text" id="chat-input" placeholder="Press Enter to chat..." autocomplete="off" />
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
